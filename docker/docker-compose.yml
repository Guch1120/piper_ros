services:
  piper-humble-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: piper-ros-humble-dev:latest
    container_name: piper-humble-dev

    # ワークスペースをマウント (ホストでのコード変更がコンテナに即反映される)
    volumes:
      # GUI (RViz, Gazebo) 用
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      #開発用コードまるごとマウント
      - ..:/ros2_ws:rw
      #terminatorの設定ファイルをマウント
      - ../.config/terminator/config:/root/.config/terminator/config:rw
      #gitのssh鍵をマウント
      # - ~/.ssh/id_rsa:/root/.ssh/id_rsa:ro
      # - ~/.ssh/id_rsa.pub:/root/.ssh/id_rsa.pub:ro
      - ~/.ssh:/root/.ssh:ro

      # usbを認識をマウント（realsense）
      - /dev:/dev
      # Hugging Faceのキャッシュディレクトリ
      - ~/.cache/huggingface:/root/.cache/huggingface
    # 環境変数 (GUI用)
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all

    # GPUの使用 (NVIDIA CUDA)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

    # ネットワーク (シミュレータとホストの通信を簡単にする)
    network_mode: host
    ipc: host

    # --- 実機開発 (CAN) 用 ---
    privileged: true
    devices:
      - /dev:/dev
    # コンテナを起動し続ける
    command: sleep infinity
