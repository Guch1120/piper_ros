gemma4_vlm_image_node:
  ros__parameters:
    image_topic: /hsrb/head_rgbd_sensor/rgb/image_rect_color
    image_topic_type: auto
    request_topic: /gemma4_vlm/request
    response_topic: /gemma4_vlm/response
    content_topic: /gemma4_vlm/content
    base_url: http://localhost:8080/v1
    model: gemma4-e2b
    max_tokens: 1024
    temperature: 0.2
    jpeg_quality: 85
    max_width: 768
    timeout: 120.0
    include_reasoning: false
    write_output_file: true
    write_output_json_file: true
    save_debug_image: true
    default_prompt: この画像に写っている物体を箇条書きで説明してください。
    request_uses_file_commands: ["", record, infer, run, default]
