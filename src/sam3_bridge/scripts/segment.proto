syntax = "proto3";

package segment;

service SegmentService {
  rpc SegmentImage (ImageRequest) returns (MaskResponse);
}

message ImageRequest {
  bytes image  = 1;
  int32 width  = 2;
  int32 height = 3;
  string prompt = 4;  // 推論プロンプト（例："person"）
}

message MaskResponse {
  bytes  mask   = 1;  // uint8のフラットなbytes（0 or 1）
  int32  width  = 2;
  int32  height = 3;
  int32  num_objects = 4;
  float  inference_ms = 5;
}